name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-deploy-phrase:
    name: Check deploy phrase
    runs-on: ubuntu-latest
    outputs:
      deploy_requested: ${{ steps.check.outputs.deploy_requested }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        id: check
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            messages="$HEAD_COMMIT_MESSAGE"
          else
            git fetch origin "$BASE_REF" --depth=100
            messages="$(git log --format=%B "origin/$BASE_REF..HEAD")"
          fi

          if grep -Fq "New Deploy" <<< "$messages"; then
            echo "deploy_requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_requested=false" >> "$GITHUB_OUTPUT"
            echo "No commit message contains 'New Deploy'. Skipping build/deploy."
          fi

  build:
    name: Build backend
    runs-on: ubuntu-latest
    needs:
      - check-deploy-phrase
    if: needs.check-deploy-phrase.outputs.deploy_requested == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t stripe-project-backend:ci .

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs:
      - check-deploy-phrase
      - build
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-deploy-phrase.outputs.deploy_requested == 'true'
    steps:
      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" <<'EOF'
          set -euo pipefail

          cd /opt/stripe-project/stripe-server
          git pull --ff-only origin main

          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d postgres
          docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend npm run migration:run:prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build backend nginx
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          EOF
