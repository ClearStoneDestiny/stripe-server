name: stripe-project

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:-stripe_app}
      POSTGRES_USER: ${POSTGRES_USER:-stripe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stripe_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: localhost
      PORT: 3000
      CLIENT_PORT: 5173
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-local_access_token_secret_change_me}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-local_refresh_token_secret_change_me}
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stripe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stripe_password}
      POSTGRES_NAME: ${POSTGRES_NAME:-stripe_app}
      POSTGRES_SYNCHRONIZE: ${POSTGRES_SYNCHRONIZE:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_dummy_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_local_dummy_secret}
      STRIPE_API_URL: ${STRIPE_API_URL:-https://api.stripe.com}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../stripe-client
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_DOMAIN: ${VITE_BACKEND_DOMAIN:-http://localhost:3000}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      BACKEND_DOMAIN: ${VITE_BACKEND_DOMAIN:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
